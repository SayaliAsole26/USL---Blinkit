<script>
        function handlePrimaryAction() {
            const btn = document.querySelector('button.bg-primary-container');
            btn.innerHTML = `<span class="animate-spin material-symbols-outlined">progress_activity</span>`;
            setTimeout(() => {
                btn.innerHTML = 'Create My Universal List';
                // Simulation of navigation or logic would go here
                alert('Initializing your Universal Shopping List...');
            }, 1000);
        }

        // Atmospheric Micro-interaction: Mouse/Gyro movement parallax
        document.addEventListener('mousemove', (e) => {
            const items = document.querySelectorAll('.floating-item');
            const mouseX = e.clientX / window.innerWidth - 0.5;
            const mouseY = e.clientY / window.innerHeight - 0.5;
            
            items.forEach((item, index) => {
                const speed = (index + 1) * 10;
                const x = mouseX * speed;
                const y = mouseY * speed;
                item.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
