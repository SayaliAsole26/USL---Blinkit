name: Deploy

on:
  workflow_dispatch:

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest -q tests/test_phase0.py

      - name: Frontend production build
        working-directory: frontend
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: https://example.up.railway.app

  migrate-hint:
    runs-on: ubuntu-latest
    needs: verify-build
    steps:
      - name: Railway migration reminder
        run: |
          echo "Deploy verified. On Railway API service, set for first deploy:"
          echo "  RUN_MIGRATIONS_ON_STARTUP=true"
          echo "  SEED_CATALOG_ON_STARTUP=true"
          echo "Then run: railway run alembic upgrade head (or rely on entrypoint)"
          echo "Worker service start command: /app/start-worker.sh"
          echo "See docs/deployment-plan.md"
